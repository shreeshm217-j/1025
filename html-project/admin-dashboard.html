<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DK Pizza Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="admin-header">
        <div class="admin-header-content">
            <a href="index.html" class="back-link">
                <span>←</span> Back to Site
            </a>
            <h1>Admin Dashboard</h1>
            <button class="btn btn-outline" onclick="logout()" data-testid="logout-btn">
                🚪 Logout
            </button>
        </div>
    </header>

    <!-- Tabs -->
    <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchTab('menu')" data-testid="tab-menu">Menu</button>
        <button class="admin-tab" onclick="switchTab('orders')" data-testid="tab-orders">Orders</button>
        <button class="admin-tab" onclick="switchTab('settings')" data-testid="tab-settings">Settings</button>
    </div>

    <!-- Menu Tab -->
    <div id="menu-tab" class="tab-content active">
        <div class="container">
            <div class="tab-header">
                <h2>Menu Items</h2>
                <button class="btn btn-primary" onclick="openAddItemModal()" data-testid="add-item-btn">
                    ➕ Add Item
                </button>
            </div>

            <div id="admin-menu-grid" class="admin-menu-grid">
                <!-- Menu items will be dynamically inserted -->
            </div>
        </div>
    </div>

    <!-- Orders Tab -->
    <div id="orders-tab" class="tab-content">
        <div class="container">
            <h2>WhatsApp Orders</h2>
            <div id="orders-list" class="orders-list">
                <!-- Orders will be dynamically inserted -->
            </div>
            <div id="no-orders" class="no-items">
                <p>No orders yet</p>
            </div>
        </div>
    </div>

    <!-- Settings Tab -->
    <div id="settings-tab" class="tab-content">
        <div class="container-small">
            <h2>Cafe Settings</h2>
            <form id="settings-form" class="settings-form" onsubmit="saveSettings(event)">
                <div class="form-group">
                    <label for="setting-hours">Opening Hours</label>
                    <input type="text" id="setting-hours" data-testid="settings-hours-input" required>
                </div>

                <div class="form-group">
                    <label for="setting-phone">Phone Number</label>
                    <input type="text" id="setting-phone" data-testid="settings-phone-input" required>
                </div>

                <div class="form-group">
                    <label for="setting-address">Address</label>
                    <textarea id="setting-address" rows="3" data-testid="settings-address-input" required></textarea>
                </div>

                <div class="form-group">
                    <label for="setting-price">Price Range</label>
                    <input type="text" id="setting-price" data-testid="settings-price-input" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full" data-testid="save-settings-btn">
                    💾 Save Settings
                </button>
            </form>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-overlay" onclick="closeItemModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Menu Item</h3>
                <button class="modal-close" onclick="closeItemModal()">&times;</button>
            </div>
            <form id="item-form" onsubmit="saveItem(event)">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" data-testid="item-name-input" required>
                </div>

                <div class="form-group">
                    <label for="item-description">Description</label>
                    <textarea id="item-description" rows="3" data-testid="item-description-input" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="item-price">Price (₹)</label>
                        <input type="number" id="item-price" step="0.01" data-testid="item-price-input" required>
                    </div>

                    <div class="form-group">
                        <label for="item-category">Category</label>
                        <select id="item-category" data-testid="item-category-select" required>
                            <option value="Pizzas">Pizzas</option>
                            <option value="Garlic Bread">Garlic Bread</option>
                            <option value="Burgers">Burgers</option>
                            <option value="Pasta">Pasta</option>
                            <option value="Fries & Sides">Fries & Sides</option>
                            <option value="Beverages">Beverages</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="item-image">Image URL (optional)</label>
                    <input type="url" id="item-image" data-testid="item-image-input">
                </div>

                <button type="submit" class="btn btn-primary btn-full" data-testid="save-item-btn">
                    💾 Save Item
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
