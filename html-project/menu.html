<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - DK Pizza Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header with Logo -->
    <header class="site-header">
        <div class="logo-container">
            <img src="https://customer-assets.emergentagent.com/job_dk-pizza-menu/artifacts/6o37aox5_WhatsApp%20Image%202026-03-11%20at%207.06.47%20PM.jpeg" alt="DK Pizza Cafe Logo" class="site-logo">
        </div>
    </header>

    <!-- Header -->
    <header class="menu-header">
        <div class="menu-header-content">
            <a href="index.html" class="back-btn" data-testid="back-to-home-btn">
                <span>←</span> Back
            </a>
            <h1>Menu</h1>
            <button class="cart-btn" onclick="toggleCart()" data-testid="cart-button">
                🛒
                <span class="cart-count" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- Category Filter -->
    <div class="category-filter" id="category-filter">
        <button class="category-btn active" data-category="All" onclick="filterCategory('All')" data-testid="category-all">All</button>
        <button class="category-btn" data-category="Pizzas" onclick="filterCategory('Pizzas')" data-testid="category-pizzas">Pizzas</button>
        <button class="category-btn" data-category="Garlic Bread" onclick="filterCategory('Garlic Bread')" data-testid="category-garlic-bread">Garlic Bread</button>
        <button class="category-btn" data-category="Burgers" onclick="filterCategory('Burgers')" data-testid="category-burgers">Burgers</button>
        <button class="category-btn" data-category="Pasta" onclick="filterCategory('Pasta')" data-testid="category-pasta">Pasta</button>
        <button class="category-btn" data-category="Fries & Sides" onclick="filterCategory('Fries & Sides')" data-testid="category-fries-sides">Fries & Sides</button>
        <button class="category-btn" data-category="Beverages" onclick="filterCategory('Beverages')" data-testid="category-beverages">Beverages</button>
    </div>

    <!-- Menu Items -->
    <section class="menu-items">
        <div class="container">
            <div id="menu-grid" class="menu-grid">
                <!-- Menu items will be dynamically inserted here -->
            </div>
            <div id="no-items" class="no-items" style="display: none;">
                <p>No items available in this category</p>
            </div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="cart-close" onclick="toggleCart()" data-testid="close-cart-btn">&times;</button>
        </div>
        
        <div id="cart-items" class="cart-items">
            <!-- Cart items will be dynamically inserted -->
        </div>
        
        <div id="cart-empty" class="cart-empty">
            <p>Your cart is empty</p>
        </div>
        
        <div id="cart-footer" class="cart-footer" style="display: none;">
            <div class="cart-total">
                <span>Total:</span>
                <span class="total-amount" id="cart-total" data-testid="cart-total">₹0</span>
            </div>
            <button class="btn btn-whatsapp btn-full" onclick="orderFromCart()" data-testid="order-whatsapp-btn">
                💬 Order on WhatsApp
            </button>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <button class="whatsapp-float" onclick="orderWhatsApp()" data-testid="floating-whatsapp-btn" aria-label="Order on WhatsApp">
        💬
    </button>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/menu.js"></script>
</body>
</html>
